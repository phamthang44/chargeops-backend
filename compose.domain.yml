# Public API and Keycloak origins are routed through this gateway. Marketing,
# console, and driver static sites are hosted outside this Compose stack.
# Apply after docker-compose.yml (IDE/dev) or docker-compose.demo.yml (containers).
services:
  gateway:
    volumes:
      - ./gateway/domain-templates:/etc/nginx/templates:ro
      - ./gateway/domain-proxy_params:/etc/nginx/domain_proxy_params:ro
      - ./logs/gateway:/var/log/nginx/chargeops
    environment:
      NGINX_ENVSUBST_FILTER: '^(API_UPSTREAM|KEYCLOAK_UPSTREAM|GRAFANA_UPSTREAM|ABUSE_GATEWAY_DRY_RUN)$'
      ABUSE_GATEWAY_DRY_RUN: ${ABUSE_GATEWAY_DRY_RUN:-on}
    networks:
      default: {}
      public_ingress:
        ipv4_address: 172.30.240.3
  keycloak:
    environment:
      KC_HOSTNAME: https://auth.chargeops.online
      KC_HOSTNAME_STRICT: 'true'
      KC_PROXY_HEADERS: xforwarded
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://grafana.chargeops.online/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.chargeops.online/realms/chargeops/protocol/openid-connect/auth
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [public]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      public_ingress:
        ipv4_address: 172.30.240.2

networks:
  public_ingress:
    ipam:
      config:
        - subnet: 172.30.240.0/29
