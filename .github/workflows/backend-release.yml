name: Backend quality and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish tested backend image to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker for integration tests
        run: docker info
      - name: Start isolated Kafka and SMTP test services
        run: docker compose -f compose.ci.yml up -d --wait --wait-timeout 180
      - name: Test and generate coverage
        run: >-
          bash mvnw -B -ntp -Pci clean verify
      - name: Software inventory (CycloneDX SBOM)
        if: always()
        run: bash mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Coverage from completed tests when verification fails
        if: failure()
        run: bash mvnw -B -ntp jacoco:report
      - name: Test report and skipped integration gate
        if: always()
        run: python3 scripts/ci-report.py
      - name: Store test, coverage and inventory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/bom.*
            target/quality-report.html
          if-no-files-found: warn
      - name: Store tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: tested-jar
          path: target/chargeops-*.jar
          if-no-files-found: error
      - name: Stop isolated test services
        if: always()
        run: docker compose -f compose.ci.yml down -v
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: quality
    environment: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-jar
          path: target
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build tested artifact
        run: docker build -f Dockerfile.release -t "$IMAGE" .
      - name: Scan release image (HIGH and CRITICAL block publication)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          output: target/image-vulnerabilities.txt
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Store vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ github.sha }}-${{ matrix.arch }}
          path: target/image-vulnerabilities.txt
      - name: Publish immutable revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > target/image-digest.txt
          echo "### Release image" >> "$GITHUB_STEP_SUMMARY"
          cat target/image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.arch }}
          path: target/image-digest.txt
