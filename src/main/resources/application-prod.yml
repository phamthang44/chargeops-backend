# ─────────────────────────────────────────────────────────────────────────────
# application-prod.yml — chỉ chứa phần khác biệt an toàn lúc chạy production.
# Hosts and secrets are supplied by the deployment environment, never by this file.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false               # prod: tắt log SQL (bảo mật + hiệu năng)

logging:
  level:
    root: WARN
    com.thang.chargeops: INFO

# Swagger: TẮT ở prod (không lộ API surface ra ngoài)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
