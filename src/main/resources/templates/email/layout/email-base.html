<!DOCTYPE html>
<html lang="vi" th:fragment="layout(content)">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<meta name="supported-color-schemes" content="light"/>
<title th:text="${subject}">ChargeOps</title>
<style>
  /*
    Responsive email styles.
    Inline CSS is applied to all structural elements for client compatibility (Gmail, Apple Mail, Outlook).
  */
  @media only screen and (max-width: 480px) {
    .px { padding-left: 20px !important; padding-right: 20px !important; }
    .h1 { font-size: 22px !important; line-height: 1.3 !important; }
    .label { display: block !important; width: 100% !important; padding: 0 0 4px 0 !important; border-bottom: 0 !important; }
    .value { display: block !important; width: 100% !important; padding: 0 0 16px 0 !important; }
    .value-last { display: block !important; width: 100% !important; padding: 0 !important; }
    .btn-table { width: 100% !important; }
    .btn-link { display: block !important; text-align: center !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;">
<div th:text="${model.preheader}" style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">Booking đã xác nhận</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#f8fafc;">
  <tr>
    <td align="center" style="padding:32px 14px 44px 14px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:separate;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px -2px rgba(15,23,42,0.04),0 2px 6px -1px rgba(15,23,42,0.02);">
        <tr>
          <td>
            <th:block th:replace="${content}"/>
          </td>
        </tr>
      </table>
      <div style="max-width:600px;padding:18px 20px 0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.65;color:#94a3b8;text-align:center;">
        Thư tự động từ ChargeOps — vui lòng không trả lời email này.
      </div>
    </td>
  </tr>
</table>
</body>
</html>
