<!DOCTYPE html>
<html lang="vi" th:fragment="layout(content)">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<meta name="supported-color-schemes" content="light"/>
<title th:text="${subject}">ChargeOps</title>
<style>
  /*
    Chỉ media query nằm trong style tag — mọi style bắt buộc đã inline vì nhiều client
    (Gmail trong đó) strip style tag. Không web font, không gradient, không animation.
  */
  @media only screen and (max-width: 480px) {
    .px { padding-left: 18px !important; padding-right: 18px !important; }
    .h1 { font-size: 22px !important; }
    .label { display: block !important; width: auto !important; padding: 0 0 6px 0 !important; border-bottom: 0 !important; }
    .value { display: block !important; padding: 0 0 14px 0 !important; }
    .value-last { display: block !important; padding: 0 !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f9;">
<div th:text="${model.preheader}" style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">Booking đã xác nhận</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#f5f5f9;">
  <tr>
    <td align="center" style="padding:28px 12px 40px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:separate;background-color:#ffffff;border:1px solid #e8e8f0;border-radius:16px;overflow:hidden;">
        <tr>
          <td>
            <th:block th:replace="${content}"/>
          </td>
        </tr>
      </table>
      <div style="max-width:600px;padding:16px 18px 0 18px;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:11px;line-height:1.7;color:#8a8a9c;text-align:center;">
        Thư tự động từ ChargeOps — vui lòng không trả lời email này.
      </div>
    </td>
  </tr>
</table>
</body>
</html>
