<!DOCTYPE html>
<html lang="vi" th:fragment="layout(content)">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<meta name="supported-color-schemes" content="light"/>
<meta name="x-apple-disable-message-reformatting"/>
<title th:text="${subject}">ChargeOps</title>
<style>
  /*
    Responsive email styles.
    Inline CSS is applied to all structural elements for client compatibility (Gmail, Apple Mail, Outlook).
  */
  table { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  td, div, p, h1 { overflow-wrap: anywhere; word-wrap: break-word; }
  a { color: #00875a; }
  @media only screen and (max-width: 600px) {
    .email-gutter { padding: 16px 10px 28px !important; }
    .email-shell { width: 100% !important; }
    .px { padding-left: 20px !important; padding-right: 20px !important; }
    .brand-cell, .status-cell { display: block !important; width: 100% !important; }
    .status-cell { padding-top: 16px !important; text-align: left !important; }
    .detail-padding { padding: 18px 16px !important; }
    .h1 { font-size: 22px !important; line-height: 1.3 !important; }
    .label { display: block !important; width: auto !important; padding: 14px 0 6px !important; border-bottom: 0 !important; }
    .value { display: block !important; width: auto !important; padding: 0 0 16px 0 !important; }
    .value-last { display: block !important; width: 100% !important; padding: 0 !important; }
    .btn-table { width: 100% !important; }
    .btn-link { display: block !important; text-align: center !important; }
  }
  @media only screen and (max-width: 360px) {
    .px { padding-left: 16px !important; padding-right: 16px !important; }
    .detail-padding { padding: 14px 12px !important; }
    .h1 { font-size: 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f3f7f5;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;-webkit-font-smoothing:antialiased;">
<div th:text="${model.preheader}" style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">Booking đã xác nhận</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;background-color:#f3f7f5;">
  <tr>
    <td class="email-gutter" align="center" style="padding:32px 14px 44px 14px;">
      <table class="email-shell" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;table-layout:fixed;border-collapse:separate;background-color:#ffffff;border:1px solid #e4ede8;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px rgba(20,60,42,0.06);">
        <tr>
          <td>
            <th:block th:replace="${content}"/>
          </td>
        </tr>
      </table>
      <div style="max-width:600px;padding:18px 20px 0 20px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;line-height:1.65;color:#64748b;text-align:center;">
        Thư tự động từ ChargeOps — vui lòng không trả lời email này.
      </div>
    </td>
  </tr>
</table>
</body>
</html>
