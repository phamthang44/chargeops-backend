# ─────────────────────────────────────────────────────────────────────────────
# application-dev.yml — chỉ chứa phần KHÁC với application.yml ở môi trường dev.
# KHÔNG lặp lại datasource/flyway/jackson... — chúng đã nằm ở base.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false                # dev: in SQL để debug

  # Reuse the Mailpit service in docker-compose.yml; host/IDE defaults below.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Host/IDE uses localhost:9092; a backend on the Compose network uses kafka:29092.
  # String JSON envelopes are validated explicitly by the future booking consumer.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: chargeops-booking-email-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: true

logging:
  level:
    root: INFO
    com.thang.chargeops: DEBUG
    org.springframework.security: DEBUG   # xem chi tiết quá trình verify token

# Swagger: bật ở dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  notification:
    reminder:
      enabled: ${BOOKING_NOTIFICATION_REMINDER_ENABLED:true}
      poll-delay-ms: 30000
      initial-delay-ms: 30000
      batch-size: 50
    email:
      enabled: ${BOOKING_NOTIFICATION_EMAIL_ENABLED:true}
      from: ${BOOKING_NOTIFICATION_EMAIL_FROM:noreply@chargeops.test}
      support-contact: ${BOOKING_NOTIFICATION_EMAIL_SUPPORT:}
      poll-delay-ms: 5000
      initial-delay-ms: 15000
      batch-size: 10
      max-attempts: 5
    kafka:
      enabled: ${BOOKING_NOTIFICATION_KAFKA_ENABLED:true}
      partitions: 3
      replication-factor: 1
      consumer:
        enabled: ${BOOKING_NOTIFICATION_CONSUMER_ENABLED:true}
        group-id: chargeops-booking-email-v1
    outbox:
      enabled: ${BOOKING_NOTIFICATION_OUTBOX_ENABLED:true}
      poll-delay-ms: 5000
      batch-size: 10
      ack-timeout-seconds: 30
  refund:
    auto-execution:
      enabled: true
