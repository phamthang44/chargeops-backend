# ─────────────────────────────────────────────────────────────────────────────
# application.yml — BASE config, chung cho MỌI môi trường.
# Quy tắc: chỉ đặt ở đây những gì KHÔNG đổi giữa dev/prod.
# Phần khác nhau → application-{profile}.yml. Secret → biến môi trường (.env).
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: chargeops

  profiles:
    # Docker bơm SPRING_PROFILES_ACTIVE vào; chạy từ IDE thì mặc định dev.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  # i18n message bundles (used by I18nUtils + error codes); locale from Accept-Language
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    resources:
      add-mappings: false

  # --- Datasource: host/credential luôn đọc qua biến, KHÔNG hardcode ---
  # Default phía sau dấu ':' chỉ dùng khi chạy ngoài Docker (IDE → localhost).
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chargeops}
    username: ${POSTGRES_USER:chargeops}
    password: ${POSTGRES_PASSWORD:chargeops}
    hikari:
      pool-name: ChargeOpsHikariPool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000   # 30s
      idle-timeout: 600000        # 10 phút
      max-lifetime: 1800000       # 30 phút

  jpa:
    open-in-view: false           # best practice: luôn tắt
    hibernate:
      ddl-auto: validate          # KHÔNG bao giờ 'update'/'create' — schema do Flyway quản
    properties:
      hibernate:
        format_sql: false

  # --- Flyway: nguồn sự thật duy nhất của schema ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    default-schema: public

  # --- Redis: dùng cho token blacklist + booking hold ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  # --- Keycloak resource server: backend chỉ XÁC MINH token, không tự login ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/chargeops}

server:
  port: 8081
  shutdown: graceful              # cho request đang chạy hoàn tất khi tắt

app:
  name: ChargeOps
  base-url: ${BACKEND_BASE_URL:http://localhost:8081}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  identity:
    keycloak-admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${KEYCLOAK_ADMIN_REALM:chargeops}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:chargeops-backend}
      # Không commit secret. Tạo confidential service-account client trong Keycloak
      # rồi chỉ cấp realm-management/view-users để đọc role của user.
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  scheduling:
    license-expiration:
      fixed-delay-ms: ${LICENSE_EXPIRATION_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${LICENSE_EXPIRATION_INITIAL_DELAY_MS:60000}
      batch-size: ${LICENSE_EXPIRATION_BATCH_SIZE:100}
    license-renewal-activation:
      fixed-delay-ms: ${LICENSE_RENEWAL_ACTIVATION_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${LICENSE_RENEWAL_ACTIVATION_INITIAL_DELAY_MS:30000}
      batch-size: ${LICENSE_RENEWAL_ACTIVATION_BATCH_SIZE:100}
  turnaround-buffer-minutes: 10
  duration-step-minutes: 30
  max-duration-minutes: 180
  max-advance-booking-days: 2
  no-show-auto-lock-minutes: 15
  # CORS allowed origins (comma-separated). Read by CorsConfig.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8082}
  imagekit:
    public-key: ${IMAGEKIT_PUBLIC_KEY:}
    private-key: ${IMAGEKIT_PRIVATE_KEY:}
    url-endpoint: ${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/chargeops}
