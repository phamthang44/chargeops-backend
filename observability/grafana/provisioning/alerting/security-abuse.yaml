{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "chargeops-security",
      "folder": "ChargeOps",
      "interval": "1m",
      "rules": [
        {
          "uid": "abuse-cooldown",
          "title": "Abuse cooldown observed",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Abuse cooldown observed; inspect Security & Abuse dashboard and mode before acting"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max((time() - chargeops_abuse_last_cooldown) < bool 300)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query",
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "abuse-store",
          "title": "Abuse Redis unavailable",
          "condition": "C",
          "for": "1m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Abuse Redis unavailable; inspect Security & Abuse dashboard and mode before acting"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rate(chargeops_abuse_decisions_total{decision=\"SEC_003\"}[1m]))",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query",
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
