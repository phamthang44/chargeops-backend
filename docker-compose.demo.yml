# =============================================================================
# ChargeOps — MÔI TRƯỜNG DEMO ĐÓNG GÓI TOÀN BỘ (FULL-STACK DOCKER COMPOSE)
# =============================================================================
# Sử dụng: TẮT TẤT CẢ IDE, chạy 1 lệnh để online toàn bộ hệ thống phục vụ demo:
#   docker compose -f docker-compose.demo.yml up --build -d
# =============================================================================

services:
  gateway:
    image: nginx:alpine
    container_name: chargeops-gateway-demo
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:80"
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: "^(WEB_UPSTREAM|API_UPSTREAM|KEYCLOAK_UPSTREAM|GRAFANA_UPSTREAM)$"
      WEB_UPSTREAM: web-portal:80
      API_UPSTREAM: backend:8081
      KEYCLOAK_UPSTREAM: keycloak:8080
      GRAFANA_UPSTREAM: grafana:3000
    volumes:
      - ./gateway/templates:/etc/nginx/templates:ro
      - ./gateway/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - web-portal
      - backend
      - keycloak
      - grafana
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # 1. PostgreSQL + PostGIS (Dữ liệu trạm sạc & định vị không gian)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chargeops-postgres-demo
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chargeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargeops}
      POSTGRES_DB: ${POSTGRES_DB:-chargeops}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - chargeops_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chargeops} -d ${POSTGRES_DB:-chargeops}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: chargeops-redis-demo
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. Keycloak IAM Server (Xác thực người dùng, Google OAuth, Token JWT)
  keycloak:
    build:
      context: ../../chargeops-frontend/chargeops-keycloak/account-console
      dockerfile: Dockerfile
    image: chargeops/keycloak:26.0.8
    container_name: chargeops-keycloak-demo
    command: start-dev --spi-theme-cache-themes=false --spi-theme-cache-templates=false --spi-theme-static-max-age=-1
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-chargeops}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-chargeops}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ../../chargeops-frontend/chargeops-keycloak/themes/chargeops-driver:/opt/keycloak/themes/chargeops-driver:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 4. Backend Spring Boot API (Resource Server, Webhook, Nghiệp vụ)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chargeops/backend:demo
    container_name: chargeops-backend-demo
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chargeops}
      - POSTGRES_USER=${POSTGRES_USER:-chargeops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chargeops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-https://thang.tail704409.ts.net}/realms/chargeops
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/chargeops/protocol/openid-connect/certs
      - KEYCLOAK_ADMIN_BASE_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM:-chargeops}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-chargeops-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-https://thang.tail704409.ts.net/api}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://thang.tail704409.ts.net}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:5173,http://localhost:8082,https://thang.tail704409.ts.net}
      - SEPAY_WEBHOOK_SECRET=${SEPAY_WEBHOOK_SECRET}
      - IMAGEKIT_PUBLIC_KEY=${IMAGEKIT_PUBLIC_KEY}
      - IMAGEKIT_PRIVATE_KEY=${IMAGEKIT_PRIVATE_KEY}
      - IMAGEKIT_URL_ENDPOINT=${IMAGEKIT_URL_ENDPOINT:-https://ik.imagekit.io/chargeops}
      - LOG_PATH=/app/logs
      - SEPAY_TEST_MODE_ENABLED=${SEPAY_TEST_MODE_ENABLED:-true}
      - SEPAY_TEST_API_TOKEN=${SEPAY_TEST_API_TOKEN}
      - SEPAY_TEST_BANK_ACCOUNT_XID=${SEPAY_TEST_BANK_ACCOUNT_XID}
      - SEPAY_TEST_ACCOUNT_NUMBER=${SEPAY_TEST_ACCOUNT_NUMBER}
      - SEPAY_TEST_VA_PREFIX=${SEPAY_TEST_VA_PREFIX}
      - SEPAY_TEST_WEBHOOK_SECRET=${SEPAY_TEST_WEBHOOK_SECRET}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # 5. Frontend Web Portal (Admin / Owner / Staff Console chạy bằng Nginx)
  web-portal:
    build:
      context: ../../chargeops-frontend/chargeops-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://thang.tail704409.ts.net/api/v1}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL:-https://thang.tail704409.ts.net}
        - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM:-chargeops}
        - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID:-chargeops-web}
        - VITE_GRAFANA_URL=/grafana/
        - VITE_USE_MOCKS=false
    image: chargeops/web-portal:demo
    container_name: chargeops-web-demo
    ports:
      - "5173:80"   # Ánh xạ vào port 5173 của máy host để script Tailscale Funnel bắt được ngay
    restart: unless-stopped
    depends_on:
      - backend
      - grafana

  # 6. Mailpit (Hộp thư ảo kiểm tra email kích hoạt, đổi mật khẩu)
  mailpit:
    image: axllent/mailpit:latest
    container_name: chargeops-mailpit-demo
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # 7. Observability nội bộ. Trình duyệt chỉ đi qua /grafana trên Web Portal.
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - chargeops_loki_data:/loki

  alloy:
    image: grafana/alloy:v1.20.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    restart: unless-stopped
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/chargeops:ro
      - chargeops_alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - chargeops_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.1.6
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8088/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: ChargeOps
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-chargeops-observability}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/chargeops/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/chargeops/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/chargeops/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'OBSERVABILITY_ADMIN') && 'Admin'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
    volumes:
      - chargeops_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - keycloak
      - loki
      - prometheus

volumes:
  # Dùng chung named volume để giữ trọn vẹn dữ liệu trạm/user đã tạo lúc Dev
  chargeops_postgres_data:
  chargeops_loki_data:
  chargeops_alloy_data:
  chargeops_prometheus_data:
  chargeops_grafana_data:
